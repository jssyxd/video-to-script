services:
  - type: web
    name: video-to-script-web
    env: python
    buildCommand: pip install -r requirements.txt && apt-get install -y ffmpeg
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 5000
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: BILIBILI_COOKIE
        sync: false
      - key: DATABASE_URL
        value: /app/data/video_to_script.db

  - type: worker
    name: video-to-script-worker
    env: python
    buildCommand: pip install -r requirements.txt && apt-get install -y ffmpeg
    startCommand: python -m app.worker
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: BILIBILI_COOKIE
        sync: false
      - key: DATABASE_URL
        value: /app/data/video_to_script.db